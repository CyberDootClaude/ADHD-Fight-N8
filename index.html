<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ADHD Fight N8</title>
  <script>
    // Load the game files with a fresh query string on every page load, so a
    // normal refresh always picks up the newest version after a deploy.
    var BUILD = Date.now();
    document.write('<link rel="stylesheet" href="css/style.css?v=' + BUILD + '">');
  </script>
</head>
<body>
  <canvas id="game" width="1280" height="720"></canvas>

  <div id="touch">
    <div class="dpad">
      <div data-k="up" class="b up">▲</div>
      <div data-k="left" class="b left">◀</div>
      <div data-k="right" class="b right">▶</div>
      <div data-k="down" class="b down">▼</div>
      <div data-k="up,left" class="b ul"></div>
      <div data-k="up,right" class="b ur"></div>
      <div data-k="down,left" class="b dl"></div>
      <div data-k="down,right" class="b dr"></div>
    </div>
    <div class="btns">
      <div data-k="L" class="b l">L</div>
      <div data-k="H" class="b h">H</div>
      <div data-k="S" class="b s">SP</div>
      <div data-k="D" class="b d">DASH</div>
      <div data-k="SU" class="b su">SUPER</div>
    </div>
    <div data-k="start" class="b pause">❚❚</div>
  </div>

  <script>
    ['util', 'audio', 'input', 'moves', 'entities', 'characters', 'fighter', 'render', 'ai', 'match', 'game'].forEach(function (f) {
      document.write('<script src="js/' + f + '.js?v=' + BUILD + '"><\/script>');
    });
  </script>
</body>
</html>
